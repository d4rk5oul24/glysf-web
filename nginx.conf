# Glysf — nginx endurecido para una web estática detrás de Easypanel (Traefik)

# Límite de peticiones por visitante: frena bots, raspadores y ataques de saturación.
limit_req_zone  $binary_remote_addr zone=porip:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=conexiones:10m;

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # IP real del visitante. La cadena es visitante -> Cloudflare -> Traefik (Docker) -> nginx, y cada salto
    # agrega una IP a X-Forwarded-For. nginx descarta las IP de confianza (Docker y Cloudflare) empezando
    # por la derecha y se queda con la primera que no lo es: la del visitante. Así el límite por IP no se
    # aplica a todo un nodo de Cloudflare. Rangos publicados en https://www.cloudflare.com/ips/ (revísalos
    # de vez en cuando).
    # Red interna de Docker (Traefik/Easypanel)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    # Cloudflare IPv4
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # Cloudflare IPv6
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # No revelar versión ni detalles del servidor.
    server_tokens off;

    # Las tildes y la ñ de los textos se sirven siempre como UTF-8.
    charset utf-8;
    charset_types text/css application/javascript text/javascript text/plain application/xml image/svg+xml;

    # Contra conexiones lentas (slowloris) y peticiones gigantes.
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    large_client_header_buffers 4 8k;

    limit_req  zone=porip burst=60 nodelay;
    limit_conn conexiones 30;
    limit_req_status 429;
    limit_conn_status 429;

    # Forzar HTTPS (Traefik/Cloudflare avisan el protocolo original) y usar siempre glysf.com sin www.
    # El destino es fijo: no se usa $host, que lo manda el cliente.
    if ($http_x_forwarded_proto = "http") { return 301 https://glysf.com$request_uri; }
    if ($host = "www.glysf.com") { return 301 https://glysf.com$request_uri; }

    # La web solo se lee: cualquier otro método se rechaza.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Cabeceras de seguridad (ver seguridad-headers.conf).
    include /etc/nginx/snippets/seguridad-headers.conf;

    # Compresión: la página carga más rápido.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript image/svg+xml text/plain application/xml;

    # Archivos ocultos (.git, .env…) y respaldos: nunca se sirven.
    location ^~ /.well-known/ { try_files $uri =404; }
    location ~ /\.            { deny all; return 404; }
    location ~* \.(bak|old|orig|swp|sql|conf|md|log)$ { deny all; return 404; }

    location = / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/seguridad-headers.conf;
        try_files /index.html =404;
    }

    location ~* \.(css|js|svg|png)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/seguridad-headers.conf;
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/seguridad-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Página 404 propia
    error_page 404 /404.html;
    location = /404.html { internal; include /etc/nginx/snippets/seguridad-headers.conf; }
}
