# Glysf — nginx endurecido para una web estática detrás de Easypanel (Traefik)

# Límite de peticiones por visitante: frena bots, raspadores y ataques de saturación.
limit_req_zone  $binary_remote_addr zone=porip:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=conexiones:10m;

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # IP real del visitante: Traefik (red interna de Docker) la manda en X-Forwarded-For.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # No revelar versión ni detalles del servidor.
    server_tokens off;

    # Contra conexiones lentas (slowloris) y peticiones gigantes.
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    large_client_header_buffers 4 8k;

    limit_req  zone=porip burst=60 nodelay;
    limit_conn conexiones 30;
    limit_req_status 429;
    limit_conn_status 429;

    # Forzar HTTPS (Traefik/Cloudflare avisan el protocolo original) y usar siempre glysf.com sin www.
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
    if ($host = "www.glysf.com") { return 301 https://glysf.com$request_uri; }

    # La web solo se lee: cualquier otro método se rechaza.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Cabeceras de seguridad (ver seguridad-headers.conf).
    include /etc/nginx/snippets/seguridad-headers.conf;

    # Compresión: la página carga más rápido.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    # Archivos ocultos (.git, .env…) y respaldos: nunca se sirven.
    location ^~ /.well-known/ { try_files $uri =404; }
    location ~ /\.            { deny all; return 404; }
    location ~* \.(bak|old|orig|swp|sql|conf|md|log)$ { deny all; return 404; }

    location = / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/seguridad-headers.conf;
        try_files /index.html =404;
    }

    location ~* \.(css|js|svg|png)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/seguridad-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Página 404 propia
    error_page 404 /404.html;
    location = /404.html { internal; include /etc/nginx/snippets/seguridad-headers.conf; }
}
